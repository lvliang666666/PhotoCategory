name: photo_storer
description: 相机分类 App - 本地照片分类管理
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.7
  image_picker: ^1.0.0
  exif: ^3.3.0
  gal: ^2.3.3
  share_plus: ^13.3.0
  photo_manager: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.2
  test: ^1.31.0

# Unit tests run on Windows and can reuse the SQLite library supplied by the
# operating system. This keeps the test runner deterministic and avoids a
# first-run binary download; Android continues to use sqflite's platform DB.
hooks:
  user_defines:
    sqlite3:
      source: system
      name: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/ui/
